# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: business-card
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: business-card-db
          property: connectionString

databases:
  - name: business-card-db
    plan: free
    region: frankfurt
    postgresMajorVersion: '17'
    databaseName: business_card
    user: business_card
    ipAllowList: []
